name: AURA CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -f devops/docker/backend/Dockerfile \
            -t ghcr.io/alwahab20089-crypto/aura-backend:latest \
            -t ghcr.io/alwahab20089-crypto/aura-backend:${{ github.sha }} \
            .

      - name: Push backend image
        run: |
          docker push ghcr.io/alwahab20089-crypto/aura-backend:latest
          docker push ghcr.io/alwahab20089-crypto/aura-backend:${{ github.sha }}

      - name: Build frontend image
        run: |
          docker build \
            -f devops/docker/frontend/Dockerfile \
            --build-arg VITE_API_URL=${{ vars.VITE_API_URL }} \
            -t ghcr.io/alwahab20089-crypto/aura-frontend:latest \
            -t ghcr.io/alwahab20089-crypto/aura-frontend:${{ github.sha }} \
            .

      - name: Push frontend image
        run: |
          docker push ghcr.io/alwahab20089-crypto/aura-frontend:latest
          docker push ghcr.io/alwahab20089-crypto/aura-frontend:${{ github.sha }}
